<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 720" width="100%" height="100%">
  <defs>
    <radialGradient id="fitGlow" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#2D1254" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0C0A15" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD" />
      <stop offset="50%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="pulseFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="375" height="720" fill="#0C0A14" />
  <rect width="375" height="720" fill="url(#fitGlow)" />

  <!-- App Header -->
  <g id="fit-header">
    <circle cx="42" cy="40" r="16" fill="#1C182B" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <text x="42" y="44" font-family="-apple-system, sans-serif" font-size="12" font-weight="900" fill="#C4B5FD" text-anchor="middle">&#125;</text>
    <text x="68" y="37" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">PULSEFIT PRO</text>
    <text x="68" y="49" font-family="monospace" font-size="9" font-weight="600" fill="rgba(255,255,255,0.5)">HEART RATE • LIVE HIIT</text>
    <rect x="286" y="28" width="66" height="24" rx="12" fill="#1A1528" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <circle cx="298" cy="40" r="3.5" fill="#EF4444" />
    <text x="324" y="44" font-family="monospace" font-size="9" font-weight="700" fill="#E2E8F0" text-anchor="middle">LIVE SYNC</text>
  </g>

  <!-- Big Biometric Ring Centerpiece -->
  <g id="activity-rings">
    <rect x="22" y="70" width="331" height="235" rx="26" fill="#141120" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    
    <!-- Outer Inactive Track -->
    <circle cx="187" cy="182" r="76" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="12" />
    <!-- Outer Active Calorie Ring -->
    <circle cx="187" cy="182" r="76" fill="none" stroke="url(#ringGrad)" stroke-width="12" stroke-dasharray="477" stroke-dashoffset="120" stroke-linecap="round" transform="rotate(-90 187 182)" />

    <!-- Middle Inactive Track -->
    <circle cx="187" cy="182" r="58" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="10" />
    <!-- Middle Active Cardio Ring -->
    <circle cx="187" cy="182" r="58" fill="none" stroke="#A78BFA" stroke-width="10" stroke-dasharray="364" stroke-dashoffset="90" stroke-linecap="round" transform="rotate(-90 187 182)" />

    <!-- Inner Core Telemetry -->
    <text x="187" y="174" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle">142</text>
    <text x="187" y="192" font-family="monospace" font-size="9" font-weight="800" fill="#EF4444" text-anchor="middle" letter-spacing="1">BPM • ZONE 4</text>
    <text x="187" y="206" font-family="monospace" font-size="8" font-weight="600" fill="rgba(255,255,255,0.5)" text-anchor="middle">PEAK CARDIO</text>

    <!-- Header inside card -->
    <rect x="38" y="86" width="118" height="22" rx="11" fill="rgba(196,181,253,0.15)" stroke="rgba(196,181,253,0.3)" stroke-width="0.8" />
    <text x="97" y="100" font-family="monospace" font-size="8.5" font-weight="700" fill="#C4B5FD" text-anchor="middle" letter-spacing="0.5">&#125; BIO-METRIC TELEMETRY</text>
  </g>

  <!-- Metric Double Tiles -->
  <g id="fit-metrics">
    <rect x="22" y="318" width="160" height="92" rx="22" fill="#141120" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <text x="40" y="344" font-family="monospace" font-size="9" font-weight="700" fill="rgba(255,255,255,0.5)">CALORIES BURNED</text>
    <text x="40" y="376" font-family="-apple-system, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF">684<tspan font-size="12" font-weight="600" fill="#C4B5FD"> kcal</tspan></text>
    <text x="40" y="394" font-family="monospace" font-size="8" font-weight="500" fill="#10B981">↑ 112% of daily target</text>

    <rect x="193" y="318" width="160" height="92" rx="22" fill="#141120" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <text x="211" y="344" font-family="monospace" font-size="9" font-weight="700" fill="rgba(255,255,255,0.5)">VO2 MAX ESTIMATE</text>
    <text x="211" y="376" font-family="-apple-system, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF">54.8</text>
    <text x="211" y="394" font-family="monospace" font-size="8" font-weight="500" fill="#A78BFA">Elite conditioning</text>
  </g>

  <!-- Cardiac EKG Pulse Waveform -->
  <g id="fit-waveform">
    <rect x="22" y="422" width="331" height="135" rx="22" fill="#141120" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <text x="40" y="448" font-family="monospace" font-size="9" font-weight="700" fill="rgba(255,255,255,0.6)" letter-spacing="1">LIVE ECG RHYTHM TRACE</text>
    <path d="M 40,510 L 100,510 L 115,485 L 125,525 L 135,460 L 145,535 L 155,505 L 165,510 L 220,510 L 235,485 L 245,525 L 255,455 L 265,535 L 275,505 L 285,510 L 330,510 L 330,535 L 40,535 Z" fill="url(#pulseFill)" />
    <path d="M 40,510 L 100,510 L 115,485 L 125,525 L 135,460 L 145,535 L 155,505 L 165,510 L 220,510 L 235,485 L 245,525 L 255,455 L 265,535 L 275,505 L 285,510 L 330,510" stroke="#C4B5FD" stroke-width="2.5" fill="none" stroke-linecap="round" />
  </g>

  <!-- Action CTA -->
  <rect x="22" y="570" width="331" height="50" rx="25" fill="url(#ringGrad)" />
  <text x="187" y="601" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">LOG INTERVAL SET  →</text>
</svg>
