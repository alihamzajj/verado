<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 720" width="100%" height="100%">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="screenGlow" cx="50%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#552BA3" stop-opacity="0.55" />
      <stop offset="45%" stop-color="#261250" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0C0A15" stop-opacity="0" />
    </radialGradient>

    <!-- Radar Core Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C4B5FD" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#8B5CF6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#6D28D9" stop-opacity="0" />
    </radialGradient>

    <!-- Button Gradient -->
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>

    <!-- Chart Fill Gradient -->
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Deep Amethyst Screen Canvas -->
  <rect width="375" height="720" fill="#0C0A14" />
  <rect width="375" height="720" fill="url(#screenGlow)" />

  <!-- Background Orbital SVG Curves (Matching Website Theme) -->
  <path d="M -30,90 C 120,40 280,220 410,130" stroke="rgba(255,255,255,0.12)" stroke-width="1" fill="none" />
  <path d="M -20,280 C 140,160 260,340 395,270" stroke="rgba(167,139,250,0.18)" stroke-width="1" stroke-dasharray="3 3" fill="none" />

  <!-- Top App Navigation Bar -->
  <g id="app-bar">
    <circle cx="42" cy="40" r="16" fill="#1C182B" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <text x="42" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#A78BFA" text-anchor="middle">&#125;</text>
    
    <text x="68" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">VERADO NEURAL</text>
    <text x="68" y="49" font-family="monospace" font-size="9" font-weight="600" fill="rgba(255,255,255,0.5)" letter-spacing="1">ENGINE v3.4 • ACTIVE</text>

    <!-- Live indicator pill -->
    <rect x="290" y="28" width="62" height="24" rx="12" fill="#1A1528" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <circle cx="303" cy="40" r="3.5" fill="#10B981" />
    <text x="323" y="44" font-family="monospace" font-size="9" font-weight="700" fill="#E2E8F0" text-anchor="middle">120 FPS</text>
  </g>

  <!-- Central Scanner Radar Card -->
  <g id="scanner-card">
    <rect x="22" y="70" width="331" height="230" rx="26" fill="#141120" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    
    <!-- Concentric Target Rings -->
    <circle cx="187" cy="175" r="85" fill="none" stroke="rgba(167,139,250,0.12)" stroke-width="1" stroke-dasharray="4 4" />
    <circle cx="187" cy="175" r="62" fill="none" stroke="rgba(167,139,250,0.22)" stroke-width="1" />
    <circle cx="187" cy="175" r="42" fill="none" stroke="rgba(167,139,250,0.35)" stroke-width="1" stroke-dasharray="2 2" />
    <circle cx="187" cy="175" r="24" fill="url(#coreGlow)" />
    
    <!-- Radar Sweep Ray -->
    <line x1="187" y1="175" x2="255" y2="125" stroke="#A78BFA" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="255" cy="125" r="4" fill="#FFFFFF" />

    <!-- Center Metric HUD -->
    <text x="187" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle">99.8%</text>
    <text x="187" y="187" font-family="monospace" font-size="8" font-weight="700" fill="#C4B5FD" text-anchor="middle" letter-spacing="1">CONFIDENCE</text>

    <!-- Top Badge inside card -->
    <rect x="38" y="86" width="112" height="22" rx="11" fill="rgba(167,139,250,0.15)" stroke="rgba(167,139,250,0.3)" stroke-width="0.8" />
    <text x="94" y="100" font-family="monospace" font-size="8.5" font-weight="700" fill="#C4B5FD" text-anchor="middle" letter-spacing="0.5">&#125; ON-DEVICE VISION</text>

    <text x="330" y="101" font-family="monospace" font-size="9" font-weight="600" fill="rgba(255,255,255,0.4)" text-anchor="end">GPU ACCELERATED</text>
  </g>

  <!-- Dual Metric Widgets -->
  <g id="kpi-metrics">
    <!-- Latency Card -->
    <rect x="22" y="312" width="160" height="92" rx="22" fill="#141120" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <circle cx="44" cy="336" r="10" fill="rgba(167,139,250,0.15)" />
    <path d="M 40,336 L 44,332 L 48,336 L 44,340 Z" fill="#A78BFA" />
    <text x="60" y="340" font-family="monospace" font-size="9" font-weight="700" fill="rgba(255,255,255,0.5)" letter-spacing="0.5">LATENCY</text>
    <text x="40" y="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">18.4<tspan font-size="12" font-weight="600" fill="#A78BFA">ms</tspan></text>
    <text x="40" y="390" font-family="monospace" font-size="8" font-weight="500" fill="#10B981">↓ 34% faster inference</text>

    <!-- Throughput Card -->
    <rect x="193" y="312" width="160" height="92" rx="22" fill="#141120" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <circle cx="215" cy="336" r="10" fill="rgba(16,185,129,0.15)" />
    <circle cx="215" cy="336" r="3" fill="#10B981" />
    <text x="231" y="340" font-family="monospace" font-size="9" font-weight="700" fill="rgba(255,255,255,0.5)" letter-spacing="0.5">MEMORY</text>
    <text x="211" y="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">42<tspan font-size="12" font-weight="600" fill="#38BDF8">MB</tspan></text>
    <text x="211" y="390" font-family="monospace" font-size="8" font-weight="500" fill="#A78BFA">Zero memory leaks</text>
  </g>

  <!-- Neural Telemetry Waveform Graph Card -->
  <g id="telemetry-chart">
    <rect x="22" y="416" width="331" height="135" rx="22" fill="#141120" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    
    <text x="40" y="442" font-family="monospace" font-size="9" font-weight="700" fill="rgba(255,255,255,0.6)" letter-spacing="1">NEURAL TENSOR THROUGHPUT</text>
    <text x="330" y="442" font-family="monospace" font-size="9" font-weight="700" fill="#A78BFA" text-anchor="end">4.8 TFLOPS</text>

    <!-- Waveform Path -->
    <path d="M 40,515 C 75,510 100,470 135,485 C 170,500 195,450 230,465 C 265,480 295,445 330,455 L 330,528 L 40,528 Z" fill="url(#chartGrad)" />
    <path d="M 40,515 C 75,510 100,470 135,485 C 170,500 195,450 230,465 C 265,480 295,445 330,455" stroke="#A78BFA" stroke-width="2.5" fill="none" stroke-linecap="round" />
    
    <!-- High Point Indicator Node -->
    <circle cx="230" cy="465" r="4.5" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2" />
    <rect x="206" y="438" width="48" height="18" rx="9" fill="#0D0B14" stroke="#A78BFA" stroke-width="1" />
    <text x="230" y="450" font-family="monospace" font-size="8" font-weight="800" fill="#C4B5FD" text-anchor="middle">PEAK</text>
  </g>

  <!-- Primary Interactive Action Button -->
  <g id="action-cta">
    <rect x="22" y="565" width="331" height="52" rx="26" fill="url(#btnGrad)" />
    <text x="187" y="597" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">RUN LIVE INFERENCE SCAN  →</text>
  </g>

  <!-- Bottom App Dock Navigation -->
  <g id="app-dock">
    <rect x="55" y="632" width="265" height="48" rx="24" fill="#141120" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    
    <!-- Dock Item 1 (Active) -->
    <circle cx="95" cy="656" r="15" fill="rgba(167,139,250,0.2)" />
    <circle cx="95" cy="656" r="4" fill="#A78BFA" />

    <!-- Dock Item 2 -->
    <circle cx="155" cy="656" r="4" fill="rgba(255,255,255,0.3)" />

    <!-- Dock Item 3 -->
    <circle cx="215" cy="656" r="4" fill="rgba(255,255,255,0.3)" />

    <!-- Dock Item 4 -->
    <circle cx="275" cy="656" r="4" fill="rgba(255,255,255,0.3)" />
  </g>
</svg>
