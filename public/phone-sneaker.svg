<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 720" width="100%" height="100%">
  <defs>
    <radialGradient id="snkGlow" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#2D1254" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0C0A15" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="purpleNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
  </defs>

  <rect width="375" height="720" fill="#0C0A14" />
  <rect width="375" height="720" fill="url(#snkGlow)" />

  <!-- App Header -->
  <g id="snk-header">
    <circle cx="42" cy="40" r="16" fill="#1C182B" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <text x="42" y="44" font-family="-apple-system, sans-serif" font-size="12" font-weight="900" fill="#A78BFA" text-anchor="middle">&#125;</text>
    <text x="68" y="37" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">SHOECHECK AI</text>
    <text x="68" y="49" font-family="monospace" font-size="9" font-weight="600" fill="rgba(255,255,255,0.5)">COMPUTER VISION • SCANNER</text>
    <rect x="274" y="28" width="78" height="24" rx="12" fill="#1A1528" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <circle cx="286" cy="40" r="3.5" fill="#10B981" />
    <text x="317" y="44" font-family="monospace" font-size="9" font-weight="700" fill="#E2E8F0" text-anchor="middle">VERIFIED</text>
  </g>

  <!-- Bounding Box Scanner Card -->
  <g id="scanner-box">
    <rect x="22" y="70" width="331" height="235" rx="26" fill="#141120" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    
    <!-- Reticle Corner Brackets -->
    <path d="M 50,110 L 50,95 L 65,95" stroke="#A78BFA" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M 325,110 L 325,95 L 310,95" stroke="#A78BFA" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M 50,265 L 50,280 L 65,280" stroke="#A78BFA" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M 325,265 L 325,280 L 310,280" stroke="#A78BFA" stroke-width="2.5" fill="none" stroke-linecap="round" />

    <!-- Center Sneaker Silhouette Vector -->
    <path d="M 90,210 Q 120,165 170,165 Q 215,165 240,190 L 285,195 Q 295,200 295,215 L 290,225 Q 275,235 245,235 L 105,235 Q 90,230 90,210 Z" fill="none" stroke="#C4B5FD" stroke-width="2" stroke-dasharray="4 4" opacity="0.8" />
    <circle cx="170" cy="180" r="5" fill="#10B981" />
    <circle cx="240" cy="205" r="5" fill="#10B981" />
    <circle cx="115" cy="220" r="5" fill="#10B981" />

    <!-- Score HUD -->
    <text x="187" y="145" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle">100%</text>
    <text x="187" y="162" font-family="monospace" font-size="9" font-weight="800" fill="#10B981" text-anchor="middle" letter-spacing="1">AUTHENTIC • MATCH CONFIRMED</text>

    <!-- Header inside card -->
    <rect x="38" y="86" width="118" height="22" rx="11" fill="rgba(167,139,250,0.15)" stroke="rgba(167,139,250,0.3)" stroke-width="0.8" />
    <text x="97" y="100" font-family="monospace" font-size="8.5" font-weight="700" fill="#C4B5FD" text-anchor="middle" letter-spacing="0.5">&#125; STITCHING ANALYZER</text>
  </g>

  <!-- Metric Double Tiles -->
  <g id="snk-metrics">
    <rect x="22" y="318" width="160" height="92" rx="22" fill="#141120" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <text x="40" y="344" font-family="monospace" font-size="9" font-weight="700" fill="rgba(255,255,255,0.5)">MODEL RECOGNIZED</text>
    <text x="40" y="374" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">AJ1 Retro High</text>
    <text x="40" y="394" font-family="monospace" font-size="8" font-weight="500" fill="#A78BFA">Colorway: Purple Obsidian</text>

    <rect x="193" y="318" width="160" height="92" rx="22" fill="#141120" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <text x="211" y="344" font-family="monospace" font-size="9" font-weight="700" fill="rgba(255,255,255,0.5)">INSPECTION LATENCY</text>
    <text x="211" y="376" font-family="-apple-system, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF">38<tspan font-size="12" font-weight="600" fill="#C4B5FD">ms</tspan></text>
    <text x="211" y="394" font-family="monospace" font-size="8" font-weight="500" fill="#10B981">Neural Engine V2</text>
  </g>

  <!-- Inspection Points Card -->
  <g id="snk-points">
    <rect x="22" y="422" width="331" height="135" rx="22" fill="#141120" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <text x="40" y="448" font-family="monospace" font-size="9" font-weight="700" fill="rgba(255,255,255,0.6)" letter-spacing="1">AUTHENTICATION CRITERIA</text>
    <text x="40" y="475" font-family="monospace" font-size="10" fill="#10B981">✓ Toe box perforation pattern: PASS</text>
    <text x="40" y="500" font-family="monospace" font-size="10" fill="#10B981">✓ Swoosh curvature &amp; edge cut: PASS</text>
    <text x="40" y="525" font-family="monospace" font-size="10" fill="#10B981">✓ Medial midsole texture density: PASS</text>
  </g>

  <!-- Action CTA -->
  <rect x="22" y="570" width="331" height="50" rx="25" fill="url(#purpleNeon)" />
  <text x="187" y="601" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">EXPORT CERTIFICATE  →</text>
</svg>
